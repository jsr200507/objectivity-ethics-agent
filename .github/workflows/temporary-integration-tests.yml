name: Temporary integration acceptance
on:
  push:
    branches:
      - test/final-minor-fixes-20261125

jobs:
  python-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute all unit and Streamlit AppTest tests
        run: python -m unittest discover -s tests -v
      - name: Check Python package compatibility
        run: python -m pip check
      - name: Check patch whitespace
        run: git diff --check HEAD~1 HEAD
